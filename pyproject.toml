[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lw-epub"
version = "0.1.0"
description = "Build EPUB ebooks from LessWrong sequences using the LessWrong API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["requests", "beautifulsoup4", "ebooklib", "lxml"]

[project.optional-dependencies]
images = ["pillow"]

[project.scripts]
lw-epub = "lw_epub:main"

[tool.setuptools]
py-modules = ["lw_epub"]
